  <head>

    <meta name="description" content="Full-stack and AI engineer. A Naruto-themed portfolio of shipped client work - that's my Ninja way." />
    <meta name="author" content="Matthew" />
    <meta name="theme-color" content="#0b0c10" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Matthew | Sage Level Developer" />
    <meta property="og:description" content="Full-stack and AI engineer. A Naruto-themed portfolio of shipped client work - that's my Ninja way." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- The loading screen's silhouette and its light masks. Without these the
         loader's first second showed nothing, because a CSS mask whose image
         has not arrived hides its element entirely. -->
    <link rel="preload" href="/naruto/sage-head.webp" as="image" type="image/webp" />
    <link rel="preload" href="/naruto/sage-outline.png" as="image" type="image/png" />
    <link rel="preload" href="/naruto/sage-outline-glow.png" as="image" type="image/png" />

    <!-- The 3D models are Draco-compressed. Fetching the decoder here lets it
         download alongside the app bundle while the loading screen is up,
         instead of only after the first model request asks for it. These are
         the two files DRACOLoader fetches when WebAssembly is available. -->
    <link rel="preload" href="/draco/draco_wasm_wrapper.js" as="fetch" crossorigin />
    <link rel="preload" href="/draco/draco_decoder.wasm" as="fetch" crossorigin />

    <!-- Anime brush-stroke and Japanese fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Kaushan+Script&family=Noto+Sans+JP:wght@400;500;700;900&family=Sawarabi+Mincho&family=Shippori+Mincho:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
